[package]
name = "slipstream"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
tun2proxy = { path = "vendor/tun2proxy", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
socket2 = { version = "0.6", features = ["all"] }

[build-dependencies]
cc = "1"

[profile.release]
strip = true
